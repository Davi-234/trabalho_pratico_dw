<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background-color: rgba(29, 28, 28, 0.774);
        }

        body {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        button {
            color: aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: blue;
            width: 15%;
            height: 30%;
            border: 1px black solid;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: rgba(0, 0, 255, 0.56);
            transform: scale(0.98);
            border-color: aqua;
            transform: translateY(-20px);
        }

        button:active {
            background-color: rgb(0, 0, 158);
            transform: scale(1.98);
        }


        header {
            position: fixed;
            z-index: 9999;
            width: 100%;
            height: 12%;
            top: 0;
            border-bottom: 1px aliceblue solid;

            display: flex;
            justify-content: center;
            align-items: center;

            color: antiquewhite;
            font-size: 2em;
            font-family: 'Times New Roman', Times, serif;
        }

        button:nth-last-child(1) {
            background-color: red;
        }

        button:nth-of-type(1) {
            background-color: green;
        }

        button:nth-last-child(1):hover {
            background-color: rgba(255, 0, 0, 0.659);
        }

        button:nth-of-type(1):hover {
            background-color: rgba(0, 128, 0, 0.67);
        }

        button:nth-last-child(1):active {
            background-color: rgb(150, 0, 0);
        }

        button:nth-of-type(1):active {
            background-color: rgb(1, 105, 1);
        }
    </style>
</head>

<body>
    <header>Index</header>
    <button onclick="window.location.href = 'calculadora/index.html';">
        <svg xmlns="http://w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            style="color: aliceblue;">
            <rect x="5" y="3" width="15" height="19" rx="2" />
            <line x1="9" y1="7" x2="16" y2="7" />
            <line x1="9" y1="11" x2="8.01" y2="11" />
            <line x1="13" y1="11" x2="12.01" y2="11" />
            <line x1="17" y1="11" x2="16.01" y2="11" />
            <line x1="9" y1="14" x2="8.01" y2="14" />
            <line x1="13" y1="14" x2="12.01" y2="14" />
            <line x1="17" y1="14" x2="16.01" y2="14" />
            <line x1="9" y1="17" x2="8.01" y2="17" />
            <line x1="13" y1="17" x2="12.01" y2="17" />
            <line x1="17" y1="17" x2="16.01" y2="17" />
        </svg>
    </button>
    <button onclick="window.location.href = 'alfabetizacao/aplicacao_alfabetizacao.html';">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            style="color: aliceblue;">

            <!-- Tablet -->
            <rect x="4" y="2.5" width="16" height="19" rx="2.2" />

            <!-- Tela -->
            <rect x="6.5" y="5" width="11" height="13" rx="1" />

            <!-- Letras -->
            <text x="8" y="10.5" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="currentColor"
                stroke="none">A</text>

            <text x="12" y="10.5" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="currentColor"
                stroke="none">B</text>

            <text x="10" y="15" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="currentColor"
                stroke="none">C</text>

            <!-- Livro -->
            <path d="M7.5 17.2
             Q9.5 16 12 17.2
             Q14.5 16 16.5 17.2
             L16.5 19
             Q14.5 17.8 12 19
             Q9.5 17.8 7.5 19 Z" />

            <!-- Estrelinhas / elementos lúdicos -->
            <path d="M3 6.5
             l0.35 0.9
             0.9 0.35
             -0.9 0.35
             -0.35 0.9
             -0.35-0.9
             -0.9-0.35
             0.9-0.35z" />

            <path d="M20.5 8
             l0.3 0.75
             0.75 0.3
             -0.75 0.3
             -0.3 0.75
             -0.3-0.75
             -0.75-0.3
             0.75-0.3z" />

            <!-- Lápis -->
            <path d="M18.5 14.5
             l2.2-2.2
             1 1
             -2.2 2.2
             z" />

            <path d="M18.5 14.5
             l-0.5 1.5
             1.5-0.5" />

            <!-- Botão inferior -->
            <circle cx="12" cy="20.2" r="0.45" />

        </svg>
    </button>
    <button onclick="window.location.href='ToDoList/index.html'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            style="color: aliceblue;">

            <!-- Moldura da lista -->
            <rect x="4" y="3" width="16" height="18" rx="2" />

            <!-- Item 1 -->
            <rect x="6.5" y="6" width="1.5" height="1.5" rx="0.3" />
            <line x1="10" y1="6.75" x2="17" y2="6.75" />

            <!-- Item 2 -->
            <rect x="6.5" y="10.5" width="1.5" height="1.5" rx="0.3" />
            <line x1="10" y1="11.25" x2="17" y2="11.25" />

            <!-- Item 3 -->
            <rect x="6.5" y="15" width="1.5" height="1.5" rx="0.3" />
            <line x1="10" y1="15.75" x2="17" y2="15.75" />

            <!-- Pequeno detalhe lúdico -->
            <path d="M16.5 18.5
             l0.3 0.7
             0.7 0.3
             -0.7 0.3
             -0.3 0.7
             -0.3-0.7
             -0.7-0.3
             0.7-0.3z" />

        </svg>
    </button>

</body>

</html>
